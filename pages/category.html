<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商家列表 - 武汉婚庆目录</title>
  <meta name="description" content="浏览武汉优质婚庆服务商列表，按类别和区域筛选。">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="../index.html" class="logo">💍 武汉婚庆目录</a>
    <div class="nav-links">
      <a href="../index.html">首页</a>
      <a href="category.html?cat=photography">婚庆摄影</a>
      <a href="category.html?cat=make-up">婚礼化妆</a>
      <a href="category.html?cat=venue">婚礼场地</a>
      <a href="category.html?cat=planner">婚庆策划</a>
      <a href="category.html?cat=host">婚礼主持</a>
    </div>
    <div class="nav-actions">
      <a href="submit.html" class="btn-outline">商家入驻</a>
    </div>
  </div>
</nav>

<section class="page-header">
  <div class="container">
    <h1 id="page-title">商家列表</h1>
    <p id="page-desc">浏览武汉优质婚庆服务商</p>
  </div>
</section>

<section class="filter-bar">
  <div class="container" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:0;">
    <select id="filter-cat" class="search-select" onchange="applyFilters()">
      <option value="">全部类别</option>
      <option value="photography">婚庆摄影</option>
      <option value="make-up">婚礼化妆</option>
      <option value="venue">婚礼场地</option>
      <option value="planner">婚庆策划</option>
      <option value="host">婚礼主持</option>
      <option value="dress">婚纱礼服</option>
      <option value="flower">婚礼花艺</option>
    </select>
    <select id="filter-district" class="search-select" onchange="applyFilters()">
      <option value="">全部区域</option>
      <option value="武昌区">武昌区</option>
      <option value="汉口区">汉口区</option>
      <option value="汉阳区">汉阳区</option>
      <option value="青山区">青山区</option>
      <option value="洪山区">洪山区</option>
      <option value="江夏区">江夏区</option>
      <option value="硚口区">硚口区</option>
      <option value="江汉区">江汉区</option>
      <option value="江岸区">江岸区</option>
    </select>
    <input type="text" id="filter-q" class="search-input" placeholder="搜索商家名称..." onkeyup="if(event.key==='Enter')applyFilters()">
    <button class="btn-search" onclick="applyFilters()">筛选</button>
    <span id="result-count" style="margin-left:auto;font-size:13px;color:#888;"></span>
  </div>
</section>

<section style="padding:32px 24px;">
  <div class="container" style="padding:0;">
    <div class="vendor-grid" id="vendor-list">
      <!-- JS动态渲染 -->
    </div>
  </div>
</section>

<script src="../js/app.js"></script>
<script>loadCategoryPage();</script>
</body>
</html>
